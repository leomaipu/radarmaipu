{% load static %}<!doctype html>
<html lang="es-CL">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>{% block titulo %}Radar Maipú · Simulador de negocio{% endblock %}</title>
  <meta name="description" content="Simula en tres pasos si tu negocio es compatible con el Plan Regulador de Maipú. Informe orientativo de la Municipalidad de Maipú.">
  <meta name="theme-color" content="#ffffff">
  <meta name="color-scheme" content="light">
  <link rel="manifest" href="{% url 'web:manifest' %}">
  <link rel="icon" type="image/png" sizes="192x192" href="{% static 'web/img/icon-192.png' %}">
  <link rel="apple-touch-icon" href="{% static 'web/img/icon-192.png' %}">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-title" content="Radar Maipú">
  <link rel="preload" href="{% static 'web/fonts/rubik-latin-400-normal.woff2' %}" as="font" type="font/woff2" crossorigin>
  <link rel="preload" href="{% static 'web/fonts/rubik-latin-800-normal.woff2' %}" as="font" type="font/woff2" crossorigin>
  <link rel="stylesheet" href="{% static 'web/vendor/leaflet/leaflet.css' %}">
  <link rel="stylesheet" href="{% static 'web/vendor/markercluster/MarkerCluster.css' %}">
  <link rel="stylesheet" href="{% static 'web/css/app.css' %}">
  {% block cabeza %}{% endblock %}
</head>
<body>
  {% block cuerpo %}{% endblock %}
</body>
</html>
